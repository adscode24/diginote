<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Orange Gradient for App Icon -->
    <linearGradient id="notakuIconGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFA100" />
      <stop offset="35%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5200" />
    </linearGradient>

    <!-- Phone Screen Gradient -->
    <linearGradient id="phoneScreenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D5DEE8" />
    </linearGradient>

    <!-- Drop shadow for bill and phone -->
    <filter id="notakuElementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Squircle Background Container -->
  <rect width="512" height="512" rx="120" fill="url(#notakuIconGrad)" />

  <!-- 1. Banknote / Uang Kertas (Tilted to the left) -->
  <g transform="translate(205, 175) rotate(-16)" filter="url(#notakuElementShadow)">
    <rect
      x="-72"
      y="-48"
      width="144"
      height="96"
      rx="14"
      fill="#FFE7D0"
      stroke="#FFFFFF"
      stroke-width="10"
    />
    <rect
      x="-60"
      y="-36"
      width="120"
      height="72"
      rx="8"
      fill="none"
      stroke="#FFA86B"
      stroke-width="3.5"
      stroke-dasharray="8 5"
    />
    <circle cx="0" cy="0" r="20" fill="#FF9147" />
    <circle cx="0" cy="0" r="13" fill="#FFE7D0" />
    <circle cx="0" cy="0" r="7" fill="#FF9147" />
    <circle cx="-46" cy="-22" r="5" fill="#FFA86B" />
    <circle cx="46" cy="22" r="5" fill="#FFA86B" />
  </g>

  <!-- 2. Smartphone (Standing upright on right) -->
  <g transform="translate(306, 170) rotate(1.5)" filter="url(#notakuElementShadow)">
    <rect
      x="-44"
      y="-68"
      width="88"
      height="136"
      rx="18"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="4"
    />
    <rect
      x="-36"
      y="-52"
      width="72"
      height="102"
      rx="9"
      fill="url(#phoneScreenGrad)"
    />
    <rect x="-10" y="-61" width="20" height="3.5" rx="1.75" fill="#9DAEC0" />
    <circle cx="-18" cy="-59" r="2.5" fill="#718295" />
  </g>

  <!-- 3. Bold White Lowercase 'n' (Foreground) -->
  <path
    d="M 206 370 L 206 242 C 206 198 238 180 264 180 C 294 180 318 198 318 242 L 318 370"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>